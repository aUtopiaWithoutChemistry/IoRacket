<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 600" width="680" height="600" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>IoRacket wiring: XIAO ESP32-S3 to MPU6050 and LiPo</title>
  <rect width="680" height="600" fill="#ffffff"/>
  <!-- MPU6050 -->
  <rect x="240" y="40" width="200" height="200" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <text x="330" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#0C447C">MPU6050</text>
  <text x="330" y="152" text-anchor="middle" font-size="12" fill="#185FA5">GY-521, component side up</text>
  <g font-size="12" fill="#444" text-anchor="end">
    <text x="424" y="68">INT</text><text x="424" y="91">AD0</text><text x="424" y="114">XCL</text><text x="424" y="137">XDA</text>
  </g>
  <g fill="#B4B2A9"><circle cx="436" cy="64" r="4"/><circle cx="436" cy="87" r="4"/><circle cx="436" cy="110" r="4"/><circle cx="436" cy="133" r="4"/></g>
  <g font-size="13" font-weight="bold" fill="#0C447C" text-anchor="end">
    <text x="424" y="160">SDA</text><text x="424" y="183">SCL</text><text x="424" y="206">GND</text><text x="424" y="229">VCC</text>
  </g>
  <g fill="#BA7517"><circle cx="436" cy="156" r="5"/><circle cx="436" cy="179" r="5"/><circle cx="436" cy="202" r="5"/><circle cx="436" cy="225" r="5"/></g>
  <!-- XIAO -->
  <rect x="220" y="335" width="240" height="165" rx="6" fill="#F1EFE8" stroke="#444441" stroke-width="1.5"/>
  <text x="340" y="410" text-anchor="middle" font-size="16" font-weight="bold" fill="#2C2C2A">XIAO ESP32-S3</text>
  <text x="340" y="432" text-anchor="middle" font-size="12" fill="#5F5E5A">component side up</text>
  <rect x="305" y="500" width="70" height="18" rx="3" fill="#ffffff" stroke="#444441"/>
  <text x="340" y="536" text-anchor="middle" font-size="12" fill="#5F5E5A">USB-C (toward end cap)</text>
  <g fill="#BA7517"><circle cx="224" cy="436" r="5"/><circle cx="224" cy="458" r="5"/><circle cx="456" cy="370" r="5"/><circle cx="456" cy="392" r="5"/></g>
  <circle cx="224" cy="480" r="4" fill="#B4B2A9"/>
  <g font-size="13" font-weight="bold" fill="#2C2C2A">
    <text x="236" y="440">3V3</text><text x="236" y="462">GND</text>
    <text x="444" y="374" text-anchor="end">D5</text><text x="444" y="396" text-anchor="end">D4</text>
  </g>
  <text x="236" y="484" font-size="12" fill="#888780">5V (not used)</text>
  <!-- wires -->
  <path d="M219 436 H170 V280 H470 V225 H442" fill="none" stroke="#E24B4A" stroke-width="2.5"/>
  <path d="M219 458 H150 V265 H485 V202 H442" fill="none" stroke="#444441" stroke-width="2.5"/>
  <path d="M461 370 H525 V179 H442" fill="none" stroke="#3B9B50" stroke-width="2.5"/>
  <path d="M461 392 H540 V156 H442" fill="none" stroke="#E0A800" stroke-width="2.5"/>
  <!-- battery note -->
  <rect x="560" y="400" width="100" height="70" rx="6" fill="#FAEEDA" stroke="#BA7517"/>
  <text x="610" y="428" text-anchor="middle" font-size="13" font-weight="bold" fill="#633806">LiPo</text>
  <text x="610" y="446" text-anchor="middle" font-size="11" fill="#854F0B">100 mAh</text>
  <text x="610" y="460" text-anchor="middle" font-size="11" fill="#854F0B">to rear BAT+/-</text>
  <!-- legend -->
  <g font-size="12" fill="#2C2C2A">
    <line x1="40" y1="575" x2="64" y2="575" stroke="#E24B4A" stroke-width="3"/><text x="70" y="579">3V3 → VCC</text>
    <line x1="190" y1="575" x2="214" y2="575" stroke="#444441" stroke-width="3"/><text x="220" y="579">GND → GND</text>
    <line x1="350" y1="575" x2="374" y2="575" stroke="#3B9B50" stroke-width="3"/><text x="380" y="579">D5 → SCL</text>
    <line x1="490" y1="575" x2="514" y2="575" stroke="#E0A800" stroke-width="3"/><text x="520" y="579">D4 → SDA</text>
  </g>
</svg>
