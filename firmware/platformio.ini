; IoRacket firmware — Seeed XIAO ESP32-S3 + MPU6050 (GY-521)
; I2C wiring: SDA = D4 (GPIO5), SCL = D5 (GPIO6), IMU powered from 3V3.
;
;   pio run -e xiao -t upload          main firmware
;   pio run -e imu_test -t upload      I2C / IMU bring-up test
;   pio run -e bl_test -t upload       reboot-to-bootloader over BLE test
;   pio run -e fifo_test -t upload     v2 step A: 1 kHz FIFO read test
;   pio run -e ble_stream -t upload    v2 step B: stream v2 packets over BLE
;   pio device monitor                 serial monitor (115200)

[platformio]
default_envs = xiao

[common]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
; After upload the board stays in download mode with the default RTS reset on this Mac;
; a watchdog reset boots the new firmware without pressing R.
board_upload.after_reset = watchdog_reset
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DIMU_SDA=5
    -DIMU_SCL=6
lib_deps =
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14

[env:xiao]
extends = common

[env:imu_test]
extends = common
build_src_filter = -<*> +<../examples/imu_test/>

[env:bl_test]
extends = common
build_src_filter = -<*> +<../examples/bl_test/>

[env:fifo_test]
extends = common
build_src_filter = -<*> +<../examples/fifo_test/>

[env:ble_stream]
extends = common
build_src_filter = -<*> +<../examples/ble_stream/>
